{% load static %}
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Quản Lý Báo Cáo | MLXPERT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{% static 'web/css/report.css' %}" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet"/>
    <script>
        function Icon(name, size = 20, color = 'currentColor', stroke = 2) {
            const icons = {
                Download: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`,
                Trash: `<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>`,
                ChevronDown: `<polyline points="6 9 12 15 18 9"/>`,
                Search: `<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>`,
                ArrowLeft: `<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>`,
                ArrowRight: `<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>`
            };
            const svgContent = icons[name] || '';
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${svgContent}</svg>`;
        }
    </script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
              <div class="logo-card">
                <img src="{% static 'web/img/logo.png' %}" alt="logo MLXpert" />
              </div>
              <nav class="menu">
                <a class="menu-item" href="{% url 'overview' %}">
                  <img src="{% static 'web/img/ic_bao_cao.png' %}"/> Báo cáo tổng quan
                </a>
                <a class="menu-item" href="{% url 'forecast' %}">
                  <img src="{% static 'web/img/ic_du_bao.png' %}"/> Dự báo nhu cầu
                </a>
                <a class="menu-item" href="{% url 'price' %}">
                  <img src="{% static 'web/img/ic_gia.png' %}"/> Mô phỏng giá & khuyến mãi
                </a>
                <a class="menu-item active" href="{% url 'report' %}">
                  <img src="{% static 'web/img/ic_quan_ly.png' %}"/> Quản lý báo cáo
                </a>
                <a class="menu-item" href="{% url 'logout' %}">
                  <img src="{% static 'web/img/ic_dang_xuat.png' %}"/> Đăng xuất
                </a>
              </nav>
            </aside>
        <main class="main">
            <header class="topbar">
                <h1>QUẢN LÝ BÁO CÁO</h1>
                <div class="userbox">
                    <span>Xin chào Admin!</span>
                    <i class="ri-user-3-line avatar"></i>
                </div>
            </header>

            <section class="report-content">
                <div class="search-container">
                    <div class="search-icon"><script>document.write(Icon('Search', 20, '#888'))</script></div>
                    <input id="search_input" type="text" placeholder="Tìm kiếm báo cáo..." />
                </div>

                <div class="action-filter-bar">
                    <div class="filters">

                        <div class="dropdown-filter" data-filter="time">
                            <span>Thời gian:</span>
                            <select></select>
                        </div>

                        <div class="dropdown-filter" data-filter="type">
                            <span>Loại:</span>
                            <select></select>
                        </div>

                        <div class="dropdown-filter" data-filter="creator">
                            <span>Người tạo:</span>
                            <input type="text" placeholder="Nhập tên" id="creator_input" />
                        </div>
                    </div>
                </div>

                <div class="report-table-wrapper">
                    <table class="report-table">
                        <thead>
                            <tr>
                                <th class="stt-cell">STT</th>
                                <th>Tên báo cáo</th>
                                <th>Loại báo cáo</th>
                                <th>Người tạo</th>
                                <th>Ngày tạo</th>
                                <th>Kích thước tệp</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="report_table_body">
                            </tbody>
                    </table>
                </div>

                <div id="pagination_container" class="pagination"></div>

            </section>
        </main>
    </div>
    <script src="{% static 'web/js/report.js' %}"></script>
</body>
</html>
